# app.json / package.json이 바뀌어 main에 병합되면(네이티브 구성이 바뀔 수 있음) 설치용 APK를 새로 빌드해
# Releases의 "mobile-latest"에 올린다. 직접 실행(Actions 탭 → Run workflow)도 된다.
# 화면·기능만 바뀐 수정은 APK가 필요 없다(무선 업데이트로 전달).
name: Android APK
on:
  push:
    branches: [main]
    paths: ['app.json', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # 멈춰도 최대 6시간 붙잡지 않도록 제한. 실패로 끝나야 기록(로그)을 읽어 원인을 찾을 수 있다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: 빌드 번호(versionCode)
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.android=j.expo.android||{};j.expo.android.versionCode=Number(process.argv[1]);fs.writeFileSync('app.json',JSON.stringify(j,null,2))" "${{ github.run_number }}"
      - name: 안드로이드 프로젝트 생성
        run: npx expo prebuild --platform android --no-install
      # 기본값(-Xmx2048m, Metaspace 512m)으로는 0.3.0(expo-updates 추가)부터
      # "OutOfMemoryError: Metaspace"가 나며 빌드가 멈췄다. 빌드 서버(메모리 16GB)에 맞게 늘린다.
      - name: 빌드 메모리 늘리기
        run: sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m/' android/gradle.properties && grep jvmargs android/gradle.properties
      - name: APK 빌드
        timeout-minutes: 45
        run: cd android && ./gradlew assembleRelease --no-daemon --console=plain --stacktrace
      - name: 파일 이름 정리
        run: |
          echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
          mv android/app/build/outputs/apk/release/app-release.apk MyCalendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MyCalendar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          target_commitish: ${{ github.sha }}
          name: 내 캘린더 폰 앱 (최신 APK)
          body: |
            앱 버전 ${{ env.APP_VERSION }} · 빌드 ${{ github.run_number }}
            이 APK는 새 폰에 처음 설치하거나, 앱 버전(version)이 바뀐 수정이 있을 때만 설치하면 됩니다.
            그 밖의 수정은 앱을 켜면 자동으로 받습니다. 기존 앱 위에 그대로 설치하면 일정과 설정은 유지됩니다.
          files: MyCalendar.apk

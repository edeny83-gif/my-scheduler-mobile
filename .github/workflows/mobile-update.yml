# main에 병합(push)되면 테스트 후 무선 업데이트(EAS Update)를 올린다. 폰 앱은 켤 때 받아 간다.
# JS 코드 변경만 전달된다. 새 권한·네이티브 패키지가 바뀌었는데 app.json version이 그대로면 막는다(native-guard).
name: Mobile Update
on:
  push:
    branches: [main]
    paths: ['src/**', 'App.js', 'index.js', 'assets/**', 'app.json', 'package.json', 'package-lock.json']
  workflow_dispatch:
concurrency:
  group: mobile-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 네이티브 변경 검사
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/native-guard.js
      - name: 무선 업데이트 게시
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::warning::EXPO_TOKEN 비밀값이 없어 무선 업데이트를 건너뜁니다"; exit 0; fi
          if ! grep -q '"projectId"' app.json; then echo "::error::app.json에 EAS projectId가 없습니다. 노트북에서 eas update:configure를 먼저 실행하세요"; exit 1; fi
          MSG="$(git log -1 --pretty=%s)"
          npx --yes eas-cli@latest update --channel production --message "$MSG" --non-interactive
